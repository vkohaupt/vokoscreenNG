name: Build vokoscreenNG AppImage (openSUSE Leap 16.0)

on:
  push:
    branches: [ "3.0" ]
  pull_request:
    branches: [ "3.0" ]

jobs:
  build-appimage:
    runs-on: ubuntu-latest

    container:
      image: opensuse/leap:16.1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 1. Erweiterte vokoscreenNG & Qt6 (WebEngine, WebSockets, Multimedia) Abhängigkeiten installieren
      - name: Install Build Dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install \
            desktop-file-utils \
            squashfs \
            wget \
            file \
            make \
            gcc-c++ \
            pkgconfig \
            qt6-base-devel \
            qt6-multimedia-devel \
            qt6-base-private-devel \
            qt6-websockets-devel \
            qt6-webchannel-devel \
            qt6-webenginecore-devel \
            qt6-webenginewidgets-devel \
            qt6-tools-linguist \
            layer-shell-qt6-devel \
            mozilla-nss-devel \
            gstreamer \
            gstreamer-devel \
            gstreamer-plugins-base-devel \
            gstreamer-plugins-bad-devel \
            gstreamer-plugin-pipewire \
            gstreamer-plugins-bad \
            gstreamer-plugins-base \
            gstreamer-plugins-good \
            gstreamer-plugins-good-gtk \
            gstreamer-plugins-libav \
            gstreamer-plugins-rs \
            gstreamer-plugin-pipewire \
            gstreamer-transcoder-devel \
            gstreamer-devtools \
            gstreamer-utils \
            libgstreamer-1_0-0 \
            kpipewire6-devel \
            kpipewire6-imports \
            libpipewire-0_3-0 \
            pipewire \
            pipewire-alsa \
            pipewire-devel \
            pipewire-jack \
            pipewire-libjack-0_3 \
            pipewire-modules-0_3 \
            pipewire-pulseaudio \
            pipewire-spa-plugins-0_2 \
            pipewire-spa-tools \
            pipewire-tools \
            libva2 \
            libva-drm2
      # 2. Kompilieren mit qmake6 und Installation ins AppDir
      - name: Build with qmake6
        run: |
          cd src
          qmake6
          make -j$(nproc)
          make INSTALL_ROOT=$(pwd)/AppDir install
      - name: Download and Run linuxdeploy
        run: |
          # 1. Herunterladen der echten Binärdatei über den direkten Release-Link
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
          mv linuxdeploy-plugin-qt-x86_64.AppImage /usr/bin/linuxdeploy-plugin-qt
      # 4a. Nur AppDir vorbereiten (ohne zu packen)
      - name: Prepare AppDir
        shell: bash
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: /usr/bin/qmake6
          EXTRA_QT_PLUGINS: "webengine;multimedia"
        run: |
          ./linuxdeploy-x86_64.AppImage --verbosity 0 \
            --appdir src/AppDir \
            --plugin qt \
            --desktop-file src/applications/vokoscreenNG.desktop \
            --icon-file src/applications/vokoscreenNG.png \
            --executable src/vokoscreenNG
      - name: Bundle GStreamer Plugins & Custom AppRun
        shell: bash
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          APPDIR="src/AppDir"
          GST_LIB_DIR="/usr/lib64/gstreamer-1.0"
          GST_BIN_DIR="/usr/libexec/gstreamer-1.0"
          mkdir -p "$APPDIR/usr/lib/gstreamer-1.0"
          mkdir -p "$APPDIR/usr/libexec/gstreamer-1.0"
          cp "$GST_LIB_DIR"/*.so "$APPDIR/usr/lib/gstreamer-1.0/"
          if [ -f "$GST_BIN_DIR/gst-plugin-scanner" ]; then
            cp "$GST_BIN_DIR/gst-plugin-scanner" "$APPDIR/usr/libexec/gstreamer-1.0/"
          fi
          # linuxdeploy EINMALIG entpacken
          ./linuxdeploy-x86_64.AppImage --appimage-extract > /dev/null
          # Alle --library Argumente in einem Array sammeln
          LIB_ARGS=()
          for plugin in "$APPDIR/usr/lib/gstreamer-1.0"/*.so; do
            LIB_ARGS+=(--library "$plugin")
          done
          # linuxdeploy nur EINMAL für alle Plugins zusammen ausführen
          ./squashfs-root/AppRun --appdir "$APPDIR" "${LIB_ARGS[@]}" --verbosity 0
          # AppRun Wrapper schreiben
          rm -f "$APPDIR/AppRun"
          cat << 'EOF' > "$APPDIR/AppRun"
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/usr/lib64:${LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="${HERE}/usr/plugins"
          export QML2_IMPORT_PATH="${HERE}/usr/qml"
          export GST_PLUGIN_SYSTEM_PATH_1_0="${HERE}/usr/lib/gstreamer-1.0"
          export GST_PLUGIN_SCANNER_1_0="${HERE}/usr/libexec/gstreamer-1.0/gst-plugin-scanner"
          export GST_PLUGIN_SYSTEM_PATH=""
          exec "${HERE}/usr/bin/vokoscreenNG" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
      # 4b. AppImage ohne AppStream-Hänger und ohne Output-Pufferung packen
      - name: Pack AppImage (Verbose)
        shell: bash
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ulimit -n 4096
          echo "=== Lade AppImage Runtime vorab per wget ==="
          wget -q https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "=== Prüfe AppDir Größe ==="
          du -sh src/AppDir
          echo "=== Entpacke linuxdeploy ==="
          ./linuxdeploy-x86_64.AppImage --appimage-extract > /dev/null
          echo "=== Starte appimagetool (ohne AppStream-Check & mit lokaler Runtime) ==="
          stdbuf -oL -eL ./squashfs-root/plugins/linuxdeploy-plugin-appimage/appimagetool-prefix/usr/bin/appimagetool \
            --no-appstream \
            --runtime-file runtime-x86_64 \
            --comp gzip \
            --verbose \
            src/AppDir 2>&1 | stdbuf -oL tr '\r' '\n'
      # 5. Artefakt sichern
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: vokoscreenNG-openSUSE-Leap16-AppImage
          path: "*.AppImage"
          
